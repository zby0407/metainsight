map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=finance_news:10m rate=10r/s;
proxy_cache_path /var/cache/nginx/finance-news levels=1:2 keys_zone=finance_news_cache:10m max_size=128m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name mem.aieduspark.com;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mem.aieduspark.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    client_max_body_size 20m;

    # Finance is internal. Browser traffic must use the Gateway's explicit
    # /api/v1/news, /api/v1/market and /api/finance facades.
    location ^~ /finance-api/ {
        return 404;
    }

    # BEGIN DeerFlow finance workspace
    location = /finance {
        return 302 /workspace;
    }

    location = /finance/ {
        return 302 /workspace;
    }

    location = /market {
        return 302 /workspace/market;
    }

    location ^~ /market/ {
        return 302 /workspace/market;
    }

    location ^~ /market-api/ {
        return 404;
    }

    location = /stocks.index.json {
        proxy_pass http://stock-server:8000/stocks.index.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://deer-flow-nginx:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /images/ {
        proxy_pass http://deer-flow-nginx:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        proxy_pass http://deer-flow-nginx:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(workspace|login|setup)(/|$) {
        proxy_pass http://deer-flow-nginx:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location ~ ^/api/(langgraph|models|memory|mcp|skills|agents|threads|sandboxes|channels|feedback|fetcher|suggestions|finance|v1)(/|$) {
        proxy_pass http://deer-flow-nginx:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
    }
    # END DeerFlow finance workspace

    location / {
        proxy_pass http://app:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
